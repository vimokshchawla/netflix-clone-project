<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse – StreamFlix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --red: #e50914;
      --red-dark: #b81d24;
      --black: #000;
      --dark: #141414;
      --card-bg: #1c1c1c;
      --text: #fff;
      --text-muted: #b3b3b3;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--black);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 4%;
      border-bottom: 1px solid #222;
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      color: var(--red);
      letter-spacing: 2px;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      list-style: none;
    }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .btn-signin {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 0.45rem 1.1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    /* ── HEADER ── */
    .page-header {
      padding: 2.5rem 4% 1rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 2px;
    }
    .page-subtitle { color: var(--text-muted); font-size: 0.9rem; }

    /* ── FILTERS ── */
    .filters {
      display: flex;
      gap: 0.8rem;
      padding: 0 4% 1.5rem;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid #222;
      margin-bottom: 1.5rem;
    }
    .filter-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-right: 0.2rem;
    }
    select, .sort-select {
      background: #222;
      color: var(--text);
      border: 1px solid #333;
      border-radius: 4px;
      padding: 0.4rem 0.8rem;
      font-size: 0.82rem;
      cursor: pointer;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    select:hover { border-color: #555; }

    .genre-pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .gpill {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-muted);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .gpill:hover, .gpill.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    /* ── GRID ── */
    .grid-container { padding: 0 4% 4rem; }
    .results-count {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
    }
    .results-count strong { color: var(--text); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 8px;
    }

    .movie-card {
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      background: var(--card-bg);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .movie-card:hover {
      transform: scale(1.04);
      z-index: 5;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7);
    }
    .movie-card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
    }
    .movie-info {
      padding: 8px 10px 10px;
    }
    .movie-title {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .movie-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .movie-match { color: #46d369; font-weight: 600; }
    .movie-genre {
      background: rgba(255,255,255,0.08);
      padding: 1px 6px;
      border-radius: 10px;
    }
    .movie-ribbon {
      position: absolute;
      top: 8px; left: 8px;
      background: var(--red);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 2px 7px;
      border-radius: 3px;
    }

    /* ── LOAD MORE ── */
    .load-more-wrap {
      text-align: center;
      padding: 2rem 0;
    }
    .btn-load {
      background: transparent;
      border: 1.5px solid var(--text-muted);
      color: var(--text);
      padding: 0.7rem 2.5rem;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-load:hover {
      background: rgba(255,255,255,0.08);
      border-color: #fff;
    }

    /* ── SKELETON ── */
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #222 25%, #2a2a2a 50%, #222 75%);
      background-size: 800px 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
      aspect-ratio: 2/3;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">StreamFlix</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="browse.html" class="active">Movies</a></li>
    <li><a href="browse.html">TV Shows</a></li>
    <li><a href="browse.html">New &amp; Popular</a></li>
    <li><a href="#">My List</a></li>
  </ul>
  <div class="nav-right">
    <a href="signin.html" class="btn-signin">Sign In</a>
  </div>
</nav>

<div class="page-header">
  <div>
    <h1 class="page-title">Browse All</h1>
    <p class="page-subtitle">Discover your next favorite movie or show</p>
  </div>
  <div style="display:flex; gap:0.8rem; align-items:center;">
    <span class="filter-label">Sort by:</span>
    <select class="sort-select" onchange="sortGrid(this.value)">
      <option value="match">Best Match</option>
      <option value="year">Year</option>
      <option value="rating">Rating</option>
      <option value="az">A–Z</option>
    </select>
  </div>
</div>

<div class="filters">
  <span class="filter-label">Filter:</span>
  <select onchange="filterType(this.value)">
    <option value="all">All Types</option>
    <option value="movie">Movies</option>
    <option value="series">TV Series</option>
    <option value="documentary">Documentary</option>
  </select>

  <select onchange="filterYear(this.value)">
    <option value="all">All Years</option>
    <option value="2024">2024</option>
    <option value="2023">2023</option>
    <option value="2022">2022</option>
    <option value="2021">2021</option>
    <option value="older">Before 2021</option>
  </select>

  <div class="genre-pills" id="genre-pills">
    <span class="gpill active" onclick="filterGenre('All', this)">All</span>
    <span class="gpill" onclick="filterGenre('Action', this)">Action</span>
    <span class="gpill" onclick="filterGenre('Comedy', this)">Comedy</span>
    <span class="gpill" onclick="filterGenre('Drama', this)">Drama</span>
    <span class="gpill" onclick="filterGenre('Sci-Fi', this)">Sci-Fi</span>
    <span class="gpill" onclick="filterGenre('Horror', this)">Horror</span>
    <span class="gpill" onclick="filterGenre('Romance', this)">Romance</span>
    <span class="gpill" onclick="filterGenre('Thriller', this)">Thriller</span>
    <span class="gpill" onclick="filterGenre('Documentary', this)">Documentary</span>
    <span class="gpill" onclick="filterGenre('Anime', this)">Anime</span>
  </div>
</div>

<div class="grid-container">
  <div class="results-count" id="count">Showing <strong>48</strong> titles</div>
  <div class="grid" id="grid"></div>
  <div class="load-more-wrap">
    <button class="btn-load" onclick="loadMore()">Load More</button>
  </div>
</div>

  { title:"Hustle", year:2022, genre:"Drama", match:86, type:"movie", img:"https://images.unsplash.com/photo-1519681393784-d120267933ba?w=300&q=70", ribbon:null },

let displayed = allMovies;
let page = 1;
const perPage = 24;

function renderGrid(data) {
  const grid = document.getElementById('grid');
  document.getElementById('count').innerHTML = `Showing <strong>${data.length}</strong> titles`;
  const slice = data.slice(0, page * perPage);
  grid.innerHTML = slice.map(m => `
    <div class="movie-card" onclick="location.href='player.html'" title="${m.title}">
      ${m.ribbon ? `<div class="movie-ribbon">${m.ribbon}</div>` : ''}
      <img src="${m.img}" alt="${m.title}" loading="lazy"/>
      <div class="movie-info">
        <div class="movie-title">${m.title}</div>
        <div class="movie-meta">
          <span class="movie-match">${m.match}%</span>
          <span>${m.year}</span>
          <span class="movie-genre">${m.genre}</span>
        </div>
      </div>
    </div>`).join('');
}

function filterGenre(genre, el) {
  document.querySelectorAll('.gpill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  displayed = genre === 'All' ? allMovies : allMovies.filter(m => m.genre === genre);
  page = 1;
  renderGrid(displayed);
}

function filterType(val) {
  displayed = val === 'all' ? allMovies : allMovies.filter(m => m.type === val);
  page = 1;
  renderGrid(displayed);
}

function filterYear(val) {
  displayed = val === 'all' ? allMovies :
    val === 'older' ? allMovies.filter(m => m.year < 2021) :
    allMovies.filter(m => m.year === parseInt(val));
  page = 1;
  renderGrid(displayed);
}

function sortGrid(val) {
  const sorted = [...displayed].sort((a,b) => {
    if (val === 'match') return b.match - a.match;
    if (val === 'year') return b.year - a.year;
    if (val === 'rating') return b.match - a.match;
    if (val === 'az') return a.title.localeCompare(b.title);
    return 0;
  });
  displayed = sorted;
  renderGrid(displayed);
}

function loadMore() {
  page++;
  renderGrid(displayed);
}

renderGrid(displayed);
</script>
</body>
