    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      --red: #e50914;

    body {
      background: #000;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.4) 100%);
    }

    /* ── TOP BAR ── */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem 2rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .ui-visible .top-bar { opacity: 1; }

    .back-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 0.8; }
    .back-btn svg { width: 20px; height: 20px; }

    .now-playing {
      font-size: 0.85rem;
    }
    .now-playing .show-name { color: var(--text-muted); font-size: 0.75rem; }
    .now-playing .ep-title { font-weight: 600; }

    .top-right {
      margin-left: auto;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .icon-btn:hover { opacity: 1; }
    .icon-btn svg { width: 22px; height: 22px; }
    .icon-btn span { font-size: 0.65rem; color: var(--text-muted); }

    /* ── CENTER PLAY ── */
    .center-overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .ui-visible .center-overlay { opacity: 1; }
    .big-play {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .big-play:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
    .big-play svg { width: 36px; height: 36px; color: #fff; }

    /* ── BOTTOM CONTROLS ── */
    .controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      padding: 0 2rem 1.5rem;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .ui-visible .controls { opacity: 1; }

    /* Progress */
    .progress-wrap {
      position: relative;
      margin-bottom: 0.8rem;
      cursor: pointer;
    }
    .progress-track {
      height: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 2px;
      position: relative;
      overflow: visible;
    }
    .progress-track:hover { height: 6px; }
    .progress-track:hover .progress-thumb { opacity: 1; }
    .progress-fill {
      height: 100%;
      background: var(--red);
      border-radius: 2px;
      width: 32%;
      position: relative;
      transition: width 0.1s linear;
    }
    .progress-buffered {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      background: rgba(255,255,255,0.25);
      width: 60%;
      border-radius: 2px;
    }
    .progress-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--red);
      opacity: 0;
      box-shadow: 0 0 4px rgba(229,9,20,0.6);
    }
    .progress-tooltip {
      position: absolute;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 0.7rem;
      padding: 3px 7px;
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
      display: none;
    }
    .progress-wrap:hover .progress-tooltip { display: block; }

    /* Chapter markers */
    .chapter-markers {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .chapter-mark {
      position: absolute;
      top: 0;
      width: 2px;
      height: 100%;
      background: rgba(255,255,255,0.5);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.15s;
      padding: 4px;
    }
    .ctrl-btn:hover { opacity: 1; transform: scale(1.1); }
    .ctrl-btn svg { width: 28px; height: 28px; }
    .ctrl-btn.small svg { width: 22px; height: 22px; }
    .ctrl-btn.xl svg { width: 36px; height: 36px; }

    .time-display {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .time-display strong { color: #fff; }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .volume-slider {
      width: 0;
      overflow: hidden;
      transition: width 0.25s;
    }
    .volume-wrap:hover .volume-slider { width: 80px; }
    input[type=range].vol {
      -webkit-appearance: none;
      appearance: none;
      width: 80px; height: 4px;
      background: rgba(255,255,255,0.3);
      outline: none;
      border-radius: 2px;
      cursor: pointer;
    }
    input[type=range].vol::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .spacer { flex: 1; }

    .quality-badge {
      font-size: 0.7rem;
      border: 1px solid rgba(255,255,255,0.4);
      color: rgba(255,255,255,0.7);
      padding: 2px 6px;
      border-radius: 3px;
    }

    /* ── NEXT EPISODE CARD ── */
    .next-ep {
      position: absolute;
      bottom: 5rem; right: 2rem;
      z-index: 10;
      background: #141414;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
      width: 250px;
      display: none;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { opacity:0; transform: translateY(20px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .next-ep.show { display: block; }
    .next-ep img { width:100%; aspect-ratio:16/9; object-fit:cover; }
    .next-ep-body { padding: 10px 12px; }
    .next-ep-label { font-size:0.65rem; color:#46d369; font-weight:700; margin-bottom:2px; }
    .next-ep-title { font-size:0.85rem; font-weight:600; margin-bottom:6px; }
    .next-ep-btns { display:flex; gap:6px; }
    .nxt-btn {
      flex: 1;
      padding: 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-align: center;
    }
    .nxt-btn.play { background: #fff; color: #000; }
    .nxt-btn.skip { background: rgba(255,255,255,0.15); color: #fff; }

    /* ── SKIP INTRO ── */
    .skip-intro {
      position: absolute;
      bottom: 5rem; right: 2rem;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      border: 1.5px solid rgba(255,255,255,0.5);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
    }
    .skip-intro:hover { background: rgba(255,255,255,0.15); }

    /* ── EPISODES PANEL ── */
    .episodes-panel {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.92);
      display: none;
      flex-direction: column;
      padding: 2rem;
      overflow-y: auto;
    }
    .episodes-panel.open { display: flex; }
    .ep-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .ep-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }
    .close-panel {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .ep-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .ep-item {
      display: flex;
      gap: 0.8rem;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid transparent;
    }
    .ep-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }
    .ep-item.current { border-color: var(--red); }
    .ep-thumb {
      flex: 0 0 120px;
      position: relative;
    }
    .ep-thumb img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
    .ep-num {
      position: absolute;
      bottom: 4px; left: 4px;
      background: rgba(0,0,0,0.7);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 2px;
    }
    .ep-info { padding: 8px 8px 8px 0; }
    .ep-title { font-size:0.82rem; font-weight:600; margin-bottom:3px; }
    .ep-duration { font-size:0.7rem; color:var(--text-muted); margin-bottom:4px; }
    .ep-desc { font-size:0.7rem; color:var(--text-muted); line-height:1.5; }

    /* Playing indicator */
    .playing-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--red);
      margin-right: 4px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

<div class="player-wrap ui-visible" id="player" onclick="toggleUI()">
  <div class="video-bg"></div>
  <div class="video-overlay"></div>

  <!-- SKIP INTRO -->
  <button class="skip-intro" id="skip-intro" onclick="event.stopPropagation(); hideSkip()">Skip Intro</button>

  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="back-btn" onclick="history.back()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      Back
    </button>
    <div class="now-playing">
      <div class="show-name">Stranger Things · Season 5</div>
      <div class="ep-title"><span class="playing-dot"></span>E8 · "The Rightside Up"</div>
    </div>
    <div class="top-right">
      <button class="icon-btn" onclick="event.stopPropagation(); openEpisodes()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
        <span>Episodes</span>
      </button>
      <button class="icon-btn" onclick="event.stopPropagation()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
        <span>Audio &amp; Subs</span>
      </button>
    </div>
  </div>

  <!-- CENTER PLAY -->
  <div class="center-overlay">
    <button class="big-play" id="big-play" onclick="event.stopPropagation(); togglePlay()">
      <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8V4z"/></svg>
    </button>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <!-- Progress -->
    <div class="progress-wrap" id="progress-wrap" onclick="seekTo(event)" onmousemove="showTooltip(event)">
      <div class="progress-track" id="track">
        <div class="progress-buffered"></div>
        <div class="progress-fill" id="progress-fill">
          <div class="chapter-markers">
            <div class="chapter-mark" style="left:20%"></div>
            <div class="chapter-mark" style="left:48%"></div>
            <div class="chapter-mark" style="left:75%"></div>
          </div>
          <div class="progress-thumb"></div>
        </div>
      </div>
      <div class="progress-tooltip" id="tooltip">24:12</div>
    </div>

    <!-- Controls row -->
    <div class="controls-row">
      <button class="ctrl-btn xl" onclick="event.stopPropagation(); togglePlay()" title="Play/Pause">
        <svg id="ctrl-play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8V4z"/></svg>
      </button>
      <button class="ctrl-btn small" onclick="event.stopPropagation(); seek(-10)" title="Rewind 10s">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.333 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/></svg>
      </button>
      <button class="ctrl-btn small" onclick="event.stopPropagation(); seek(10)" title="Forward 10s">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.933 12.8a1 1 0 000-1.6L6.6 7.2A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.333-4z"/></svg>
      </button>

      <div class="volume-wrap" onclick="event.stopPropagation()">
        <button class="ctrl-btn small" id="vol-btn" onclick="toggleMute()" title="Volume">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
        <div class="volume-slider">
          <input type="range" class="vol" min="0" max="100" value="80" id="vol-range" oninput="setVolume(this.value)"/>
        </div>
      </div>

      <div class="time-display">
        <strong id="current-time">24:12</strong> / <span id="total-time">1:16:57</span>
      </div>

      <div class="spacer"></div>

      <span class="quality-badge">4K Ultra HD</span>

      <button class="ctrl-btn small" title="Settings" onclick="event.stopPropagation()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>

      <button class="ctrl-btn small" id="fs-btn" onclick="event.stopPropagation(); toggleFullscreen()" title="Fullscreen">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
      </button>
    </div>
  </div>

  <!-- NEXT EPISODE -->
  <div class="next-ep" id="next-ep">
    <img src="https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=300&q=70" alt="Next Episode"/>
    <div class="next-ep-body">
      <div class="next-ep-label">Next Episode</div>
      <div class="next-ep-title">E5 · "The Nina Project"</div>
      <div class="next-ep-btns">
        <button class="nxt-btn play" onclick="location.reload()">▶ Play</button>
        <button class="nxt-btn skip" onclick="document.getElementById('next-ep').classList.remove('show')">✕</button>
      </div>
    </div>
  </div>

  <!-- EPISODES PANEL -->
  <div class="episodes-panel" id="episodes-panel">
    <div class="ep-header">
      <h2>Stranger Things – Season 5</h2>
      <button class="close-panel" onclick="closeEpisodes()">✕</button>
    </div>
    <div class="ep-grid" id="ep-grid"></div>
  </div>
</div>

<script>
  // State
  // State
  let playing = false;
  let muted = false;
  let progress = 32;
  let uiTimeout;
  let totalSecs = 4617; // 1:16:57
  let currentSecs = 1452; // 24:12

  const episodes = [
    { num:1, title:"The Crawl", duration:"1h 10m", desc:"The gang reunites in Hawkins as the gates to the Upside Down begin to spread. Eleven must confront a new threat unlike anything before.", img:"https://images.unsplash.com/photo-1509023464722-18d996393ca8?w=200&q=70", current:false },
    { num:2, title:"Invasion", duration:"1h 14m", desc:"Hawkins falls under attack. Joyce and Hopper race back to the States while Eleven taps into a power she's never felt before.", img:"https://images.unsplash.com/photo-1534447677768-be436bb09401?w=200&q=70", current:false },
    { num:3, title:"The Gate", duration:"1h 5m", desc:"A massive rift tears through downtown Hawkins. The group splits to tackle two fronts — the real world and the Upside Down.", img:"https://images.unsplash.com/photo-1464802686167-b939a6910659?w=200&q=70", current:false },
    { num:4, title:"Shadow Fall", duration:"1h 20m", desc:"Vecna's influence spreads further than ever imagined. Will fights to maintain control while Mike and Dustin discover a hidden tunnel.", img:"https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=200&q=70", current:false },
    { num:5, title:"Into the Dark", duration:"1h 18m", desc:"The team ventures deep into the Upside Down. Eleven faces the most harrowing test of her powers as losses mount.", img:"https://images.unsplash.com/photo-1518676590629-3dcbd9c5a5c9?w=200&q=70", current:false },
    { num:6, title:"Broken World", duration:"1h 22m", desc:"Hawkins is unrecognizable. Survivors scatter as the Upside Down bleeds into every corner of the town.", img:"https://images.unsplash.com/photo-1605106702734-205df224ecce?w=200&q=70", current:false },
    { num:7, title:"The Last Stand", duration:"1h 30m", desc:"All hope seems lost. Eleven and her friends make a final desperate push to close the gate — and save everyone they love.", img:"https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=200&q=70", current:false },
    { num:8, title:"The Rightside Up", duration:"1h 42m", desc:"In the stunning series finale, the gang makes their ultimate sacrifice to restore Hawkins and seal the Upside Down forever.", img:"https://images.unsplash.com/photo-1503095396549-807759245b35?w=200&q=70", current:true },
  ];

  // Build episodes
  document.getElementById('ep-grid').innerHTML = episodes.map(e => `
    <div class="ep-item ${e.current ? 'current' : ''}" onclick="closeEpisodes()">
      <div class="ep-thumb">
        <img src="${e.img}" alt="${e.title}"/>
        <div class="ep-num">E${e.num}</div>
      </div>
      <div class="ep-info">
        <div class="ep-title">${e.current ? '<span class="playing-dot"></span>' : ''}${e.title}</div>
        <div class="ep-duration">${e.duration}</div>
        <div class="ep-desc">${e.desc}</div>
      </div>
    </div>`).join('');

  // Progress simulation
  let interval = setInterval(() => {
    if (playing) {
      currentSecs++;
      if (currentSecs >= totalSecs) { clearInterval(interval); showNextEp(); return; }
      progress = (currentSecs / totalSecs) * 100;
      updateProgress();
    }
  }, 1000);

  function updateProgress() {
    document.getElementById('progress-fill').style.width = progress + '%';
    document.getElementById('current-time').textContent = formatTime(currentSecs);
  }

  function formatTime(s) {
    const m = Math.floor(s/60), sec = s % 60;
    return `${m}:${String(sec).padStart(2,'0')}`;
  }

  function seekTo(e) {
    const wrap = document.getElementById('track');
    const rect = wrap.getBoundingClientRect();
    progress = ((e.clientX - rect.left) / rect.width) * 100;
    currentSecs = Math.floor((progress / 100) * totalSecs);
    updateProgress();
    if (progress > 85) showNextEp();
    e.stopPropagation();
  }

  function showTooltip(e) {
    const wrap = document.getElementById('track');
    const rect = wrap.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const secs = Math.floor(pct * totalSecs);
    const tip = document.getElementById('tooltip');
    tip.textContent = formatTime(secs);
    tip.style.left = (pct * 100) + '%';
  }

  function seek(secs) {
    currentSecs = Math.max(0, Math.min(totalSecs, currentSecs + secs));
    progress = (currentSecs / totalSecs) * 100;
    updateProgress();
  }

  function togglePlay() {
    playing = !playing;
    const playPaths = {
      play: '<path d="M6 4l15 8-15 8V4z"/>',
      pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    };
    document.getElementById('play-icon').innerHTML = playing ? playPaths.pause : playPaths.play;
    document.getElementById('ctrl-play-icon').innerHTML = playing ? playPaths.pause : playPaths.play;
    showUI();
  }

  function toggleMute() {
    muted = !muted;
    document.getElementById('vol-range').value = muted ? 0 : 80;
  }
  function setVolume(v) { muted = v == 0; }

  // UI visibility
  function showUI() {
    document.getElementById('player').classList.add('ui-visible');
    clearTimeout(uiTimeout);
    if (playing) uiTimeout = setTimeout(hideUI, 3500);
  }
  function hideUI() {
    document.getElementById('player').classList.remove('ui-visible');
  }
  function toggleUI() {
    document.getElementById('player').classList.toggle('ui-visible');
    clearTimeout(uiTimeout);
    if (document.getElementById('player').classList.contains('ui-visible') && playing) {
      uiTimeout = setTimeout(hideUI, 3500);
    }
  }

  document.getElementById('player').addEventListener('mousemove', showUI);

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  function showNextEp() {
    document.getElementById('next-ep').classList.add('show');
    document.getElementById('skip-intro').style.display = 'none';
  }

  function hideSkip() {
    document.getElementById('skip-intro').style.display = 'none';
    seek(120);
  }

  function openEpisodes() {
    document.getElementById('episodes-panel').classList.add('open');
    showUI();
  }
  function closeEpisodes() {
    document.getElementById('episodes-panel').classList.remove('open');
  }

  // Auto-hide skip intro after 8s
  setTimeout(() => {
    const s = document.getElementById('skip-intro');
    if (s) s.style.display = 'none';
  }, 8000);

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    if (e.key === 'ArrowLeft') seek(-10);
    if (e.key === 'ArrowRight') seek(10);
    if (e.key === 'f') toggleFullscreen();
    if (e.key === 'Escape') closeEpisodes();
  });

  updateProgress();
</script>
</body>
</html>
